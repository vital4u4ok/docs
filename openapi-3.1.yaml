  /diagnostics/echo:
    get:
      operationId: echoParameters
      tags:
      - diagnostics
      summary: Echo every parameter back
      description: |
        Every remaining parameter combination the specification allows, in one place:
        `form`, `spaceDelimited`, `pipeDelimited` and `deepObject` in the query,
        `simple` in a header, `form` in a cookie, each with both `explode` values, plus
        `allowEmptyValue` and a parameter described with `content` instead of `schema`.

        The response reports what the server parsed, so a client can check its own
        serializer against the description.
      security:
      - digestAuth: []
      parameters:
      - name: tags
        in: query
        style: form
        explode: true
        description: Array, exploded. The key repeats once per item.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - retail
            - eu
      - name: filters
        in: query
        style: form
        explode: false
        description: Array, not exploded. One key, comma separated.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - open
            - frozen
      - name: flat
        in: query
        style: form
        explode: false
        description: Object, not exploded. Keys and values alternate in one value.
        schema:
          type: object
          properties:
            status:
              type: string
            currency:
              type: string
        examples:
          pair:
            value:
              status: open
              currency: GBP
      - name: bbox
        in: query
        style: spaceDelimited
        explode: false
        description: Space delimited, not exploded. The spaces are percent encoded.
        schema:
          type: array
          items:
            type: number
            format: double
        examples:
          box:
            value:
            - -0.51
            - 51.28
            - 0.33
            - 51.69
      - name: bboxExploded
        in: query
        style: spaceDelimited
        explode: true
        description: |
          Space delimited, exploded. Exploding removes the delimiter entirely, so this
          is indistinguishable from `form` with `explode: true`.
        schema:
          type: array
          items:
            type: number
            format: double
        examples:
          box:
            value:
            - -0.51
            - 51.28
      - name: codes
        in: query
        style: pipeDelimited
        explode: false
        description: Pipe delimited, not exploded.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - GB
            - IE
      - name: codesExploded
        in: query
        style: pipeDelimited
        explode: true
        description: Pipe delimited, exploded. As above, the delimiter disappears.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - GB
            - IE
      - name: where
        in: query
        style: deepObject
        explode: true
        description: Nested object, one bracketed key per property.
        schema:
          type: object
          properties:
            status:
              type: string
            minBalance:
              type: number
              format: double
        examples:
          pair:
            value:
              status: open
              minBalance: 100
      - name: verbose
        in: query
        allowEmptyValue: true
        description: |
          Flag parameter. `allowEmptyValue` lets the key appear with no value at all.
          The specification marks this field as not recommended, and it is here to be
          rendered rather than copied.
        schema:
          type: boolean
          default: false
        examples:
          bare:
            value: true
      - name: selector
        in: query
        description: |
          A structured value carried in a single parameter, described with `content`
          rather than `schema`, so the media type says how it is encoded.
        content:
          application/json:
            schema:
              type: object
              required:
              - fields
              properties:
                fields:
                  type: array
                  items:
                    type: string
                depth:
                  type: integer
                  minimum: 1
                  maximum: 5
            examples:
              twoFields:
                value:
                  fields:
                  - id
                  - balance
                  depth: 2
      - name: X-Accept-Features
        in: header
        style: simple
        explode: false
        description: Array in a header. `simple` is the only style headers allow.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - hal
            - problem-json
      - name: X-Trace-Options
        in: header
        style: simple
        explode: true
        description: |
          Object in a header. Exploding turns the flat `k,v,k,v` list into `k=v` pairs.
        schema:
          type: object
          properties:
            sampled:
              type: boolean
            rate:
              type: number
              format: double
        examples:
          pair:
            value:
              sampled: true
              rate: 0.1
      - name: prefs
        in: cookie
        style: form
        explode: true
        description: |
          Object in a cookie. With `explode: true` each property becomes its own
          cookie, which is why the specification warns the behaviour is not fully
          defined for cookies.
        schema:
          type: object
          properties:
            theme:
              type: string
            density:
              type: string
        examples:
          pair:
            value:
              theme: dark
              density: compact
      - name: session_flags
        in: cookie
        style: form
        explode: false
        description: Array in a cookie, comma separated inside one cookie value.
        schema:
          type: array
          items:
            type: string
        examples:
          two:
            value:
            - beta
            - internal
      responses:
        '200':
          description: |
            What the server parsed. Each entry reports the raw value as it arrived and the value after the
            declared style was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticEcho'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Problem'
  /diagnostics/path/{simpleObject}/{labelArray}/{matrixArray}:
    get:
      operationId: echoPathStyles
      tags:
      - diagnostics
      summary: Echo the path serialization styles
      description: |
        The three path-capable styles with the `explode` values the rest of this
        description does not already use. Together with
        `GET /branches/{branchId}/atms/{coords}` every path style and `explode`
        combination is covered.

        A request looks like
        `/diagnostics/path/kind=card,id=42/.eu.lon.01/;matrixArray=1,2,3`.
      security:
      - oauth2Password:
        - accounts:read
      parameters:
      - name: simpleObject
        in: path
        required: true
        style: simple
        explode: true
        description: Object with `simple`, exploded into `k=v` pairs.
        schema:
          type: object
          required:
          - kind
          - id
          properties:
            kind:
              type: string
            id:
              type: string
        examples:
          card:
            value:
              kind: card
              id: '42'
      - name: labelArray
        in: path
        required: true
        style: label
        explode: true
        description: Array with `label`, exploded so every item gets its own dot.
        schema:
          type: array
          minItems: 1
          items:
            type: string
        examples:
          three:
            value:
            - eu
            - lon
            - '01'
      - name: matrixArray
        in: path
        required: true
        style: matrix
        explode: false
        description: Array with `matrix`, not exploded, so the name appears once.
        schema:
          type: array
          minItems: 1
          items:
            type: integer
        examples:
          three:
            value:
            - 1
            - 2
            - 3
      responses:
        '200':
          description: What the server parsed. The three values after the declared styles were applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticEcho'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Problem'
  /diagnostics/payload:
    post:
      operationId: postDiagnosticPayload
      tags:
      - diagnostics
      summary: Accept a payload in any media type
      description: |
        Thirteen request media types on one operation, including a media type range
        (`image/*`), a catch-all (`*/*`) with an empty schema, a sequential type
        described with `itemSchema`, and `multipart/related` with per-part `encoding`.
      security:
      - oauth2AllFlows:
        - diagnostics:write
      requestBody:
        required: true
        description: Whatever the caller has to hand.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticEnvelope'
            examples:
              minimal:
                $ref: '#/components/examples/DiagnosticMinimal'
              full:
                $ref: '#/components/examples/DiagnosticFull'
          application/vnd.api+json:
            schema:
              type: object
              description: JSON:API document wrapping the same envelope.
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      const: diagnostic
                    id:
                      type: string
                    attributes:
                      $ref: '#/components/schemas/DiagnosticEnvelope'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DiagnosticEnvelope'
          application/x-ndjson:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DiagnosticEvent'
          text/html:
            schema:
              type: string
              contentMediaType: text/html
              description: Rendered report, stored verbatim.
          text/markdown:
            schema:
              type: string
              description: The same report as source.
            example: |
              # Diagnostic report

              - captured: 2026-09-08T11:04:19Z
              - severity: info
          text/csv:
            schema:
              type: string
              description: One row per event, header row required.
            example: |
              at,severity,message
              2026-09-08T11:04:19Z,info,switch reachable
          image/png:
            schema:
              type: string
              contentMediaType: image/png
              description: Screenshot from the terminal.
          image/*:
            schema:
              type: string
              contentMediaType: image/*
              description: |
                A media type range. Any image the terminal can produce is accepted; the
                concrete type arrives in `Content-Type`.
          application/zip:
            schema:
              type: string
              contentMediaType: application/zip
              description: Archive of several reports.
          application/cbor:
            schema:
              type: string
              contentMediaType: application/cbor
              description: The envelope, encoded as CBOR.
          multipart/related:
            schema:
              type: object
              required:
              - report
              properties:
                report:
                  $ref: '#/components/schemas/DiagnosticEnvelope'
                screenshot:
                  type: string
                  contentMediaType: image/png
            encoding:
              report:
                contentType: application/json
              screenshot:
                contentType: image/png
                headers:
                  Content-Location:
                    schema:
                      type: string
                      format: uri-reference
          '*/*':
            schema:
              description: Anything else. The schema constrains nothing at all.
      responses:
        '202':
          description: Payload accepted. The payload is stored for 24 hours and then discarded.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticEcho'
        '413':
          description: Payload too large. The hard limit is 8 MiB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '415':
          description: Unsupported media type. Only the types listed above are accepted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceDiagnosticPayload
      tags:
      - diagnostics
      summary: Replace the stored payload
      description: |
        The request body is a `$ref` to `components.requestBodies`, and its examples are
        in turn `$ref`s into `components.examples`.
      security:
      - digestAuth: []
      - apiKeyHeader: []
      requestBody:
        $ref: '#/components/requestBodies/DiagnosticPayload'
      responses:
        '204':
          description: Replaced. No body is returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: annotateDiagnosticPayload
      tags:
      - diagnostics
      summary: Annotate the stored payload
      description: |
        The request body is optional. `required` defaults to `false`, and it is spelled
        out here so the rendering is unambiguous.
      security: []
      requestBody:
        required: false
        description: Omit the body to clear the annotation.
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 280
      responses:
        '204':
          description: Annotated. No body is returned.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /ping:
    summary: Liveness probe
    description: Reusable Path Item Object, referenced from `paths`.
    get:
      operationId: ping
      tags:
      - system
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The service is up. Returned only when the process can reach both its database and
            its message broker.
          content:
            text/plain:
              schema:
                type: string
                const: pong
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The service is draining. The instance is shutting down and no longer accepts work.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /accounts/{accountId}/postings/query:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    - $ref: '#/components/parameters/RequestId'
    post:
      operationId: queryAccountPostings
      tags:
      - accounts
      - transactions
      - beta
      summary: Query postings with a request body
      description: |
        Sends the filter in a request body. The 3.2 description of this API uses the `QUERY` HTTP method here; 3.1 has no way to describe that, so it is modelled as `POST` on a sub-path.
      security:
      - oauth2AuthCode:
        - transactions:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingQuery'
      responses:
        '200':
          description: Matching postings. Ordered by `bookedAt`, honouring the `order` field of the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Problem'
  /payments/{paymentId}/hold:
    parameters:
    - name: paymentId
      in: path
      required: true
      description: Payment instruction identifier.
      schema:
        type: string
        format: uuid
    post:
      operationId: lockPayment
      tags:
      - payments
      - beta
      summary: Place a hold on a payment
      description: |
        Described with the `LOCK` method through `additionalOperations` in the 3.2 version of this API. 3.1 has no such field, so it is modelled as `POST` on a sub-resource.
      security:
      - oauth2AuthCode:
        - payments:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - timeoutSeconds
              properties:
                timeoutSeconds:
                  type: integer
                  minimum: 30
                  maximum: 86400
                  default: 300
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Hold placed. The payment will not settle until the hold is released or the timeout
            expires.
          headers:
            Lock-Token:
              description: Opaque token required to release the hold.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHold'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unlockPayment
      tags:
      - payments
      - beta
      summary: Release a hold
      security:
      - oauth2AuthCode:
        - payments:write
      parameters:
      - name: Lock-Token
        in: header
        required: true
        description: Token returned by `LOCK`.
        schema:
          type: string
      responses:
        '204':
          description: Hold released. No body. Settlement resumes on the next cycle.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      description: |
        Described with the `UNLOCK` method through `additionalOperations` in the 3.2 version of this API. 3.1 has no such field, so it is modelled as `DELETE` on a sub-resource.
components:
  securitySchemes:
    oauth2AuthCode:
      type: oauth2
      description: |
        Interactive, user-present access. The default for anything that reads or
        moves a customer's money.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.meridian.example.com/oauth2/authorize
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          refreshUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            accounts:read: Read account details and balances.
            accounts:write: Open, amend and close accounts.
            transactions:read: Read postings and export them.
            payments:read: Read payment instructions.
            payments:write: Initiate payments and manage holds.
            cards:read: Read card details.
            documents:write: Upload documents.
    oauth2ClientCredentials:
      type: oauth2
      description: Server-to-server access for back-office integrations. No user context.
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          refreshUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            accounts:write: Open accounts on behalf of an onboarded partner.
            transactions:read: Read postings across the partner's portfolio.
            cards:write: Authorize and reverse card transactions.
    oauth2Implicit:
      type: oauth2
      description: |-
        Deprecated. Retired. Kept only so existing single-page clients keep rendering; use
        `oauth2AuthCode` with PKCE instead. `deprecated` on a security scheme is new in 3.2.
      flows:
        implicit:
          authorizationUrl: https://auth.meridian.example.com/oauth2/authorize
          refreshUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            accounts:read: Read account details and balances.
    openId:
      type: openIdConnect
      description: Discovery-driven OIDC, for clients that want an id token alongside the access token.
      openIdConnectUrl: https://auth.meridian.example.com/.well-known/openid-configuration
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A pre-minted JWT, for internal callers that already hold one.
    basicAuth:
      type: http
      scheme: basic
      description: Legacy terminal integration only. Never use over a non-TLS connection.
    httpSignature:
      type: http
      scheme: signature
      description: |
        HTTP Message Signatures (RFC 9421). Required in addition to a token on any
        request that moves money.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner key. Scoped to a tenant, rate limited per key.
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Deprecated. Keys in the query string end up in access logs. Use `X-Api-Key`.
    apiKeyCookie:
      type: apiKey
      in: cookie
      name: mb_session
      description: Session cookie issued by the online banking front end.
    mutualTls:
      type: mutualTLS
      description: |
        Client certificate issued by the Meridian partner CA. Presented at the TLS
        layer, so it carries no wire-level parameters of its own.
    oauth2Password:
      type: oauth2
      description: |
        Resource owner password credentials, kept only for the legacy mobile app, which
        has no browser to hand off to. New clients use `oauth2AuthCode` with PKCE.
      flows:
        password:
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          refreshUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            accounts:read: Read account details and balances.
            transactions:read: Read postings and export them.
    oauth2AllFlows:
      type: oauth2
      description: |
        One scheme declaring every flow the specification defines. The Flows Object
        allows all of them side by side, and a client picks whichever it can support.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.meridian.example.com/oauth2/authorize
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          refreshUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            diagnostics:write: Post diagnostic payloads.
        clientCredentials:
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            diagnostics:write: Post diagnostic payloads.
        implicit:
          authorizationUrl: https://auth.meridian.example.com/oauth2/authorize
          scopes:
            diagnostics:write: Post diagnostic payloads.
        password:
          tokenUrl: https://auth.meridian.example.com/oauth2/token
          scopes:
            diagnostics:write: Post diagnostic payloads.
    digestAuth:
      type: http
      scheme: digest
      description: |
        RFC 7616 digest access authentication, still spoken by the branch back-office
        terminals. The challenge arrives in `WWW-Authenticate`.
  requestBodies:
    DiagnosticPayload:
      description: |
        The reusable form of the diagnostics body. Referenced from an operation with
        `$ref`, which is the only place a Request Body Object can be reused.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiagnosticEnvelope'
          examples:
            minimal:
              $ref: '#/components/examples/DiagnosticMinimal'
            full:
              $ref: '#/components/examples/DiagnosticFull'
            external:
              $ref: '#/components/examples/DiagnosticExternal'
  examples:
    DiagnosticMinimal:
      summary: The smallest envelope the server accepts
      description: Only the two required fields.
      value:
        capturedAt: '2026-09-08T11:04:19Z'
        severity: info
    DiagnosticFull:
      summary: Every field populated
      value:
        capturedAt: '2026-09-08T11:04:19Z'
        severity: warning
        source: switch
        events:
        - at: '2026-09-08T11:04:19Z'
          severity: info
          message: switch reachable
        - at: '2026-09-08T11:04:41Z'
          severity: warning
          message: authorization latency above 400 ms
        context:
          terminal: MK3-0042
          firmware: 7.2.1
    DiagnosticExternal:
      summary: Fetched from the developer portal
      description: |
        Carries `externalValue` instead of an inline value. The two are mutually
        exclusive, so this example holds no data of its own.
      externalValue: https://developers.meridian.example.com/examples/diagnostic-full.json
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Account identifier.
      schema:
        type: string
        format: uuid
      example: 6f5b2f0e-0d5a-4a2f-9a41-2b8c1a7d4e10
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Client-generated correlation id, echoed on every response.
      schema:
        type: string
        format: uuid
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Language for human-readable fields such as `Problem.detail`.
      schema:
        type: string
        default: en-GB
      examples:
        ukrainian:
          summary: Ukrainian, falling back to English
          value: uk-UA, en-GB;q=0.8
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Replaying a request with the same key returns the original outcome instead
        of creating a second one. Keys are retained for 24 hours.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque page cursor taken from the previous response.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: pageSize
      in: query
      description: Maximum items per page.
      schema:
        type: integer
        format: int32
        default: 25
        minimum: 1
        maximum: 200
  headers:
    ETag:
      description: Entity tag for conditional requests.
      schema:
        type: string
      example: '"a3f1c9"'
    Location:
      description: Absolute URL of the created or queued resource.
      required: true
      schema:
        type: string
        format: uri
    RequestId:
      description: Echo of the request's `X-Request-Id`.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds to wait before polling or retrying.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
    Link:
      description: Web links for pagination, per RFC 8288.
      schema:
        type: string
      example: <https://eu.api.meridian.example.com/v2/accounts?cursor=eyJvIjoxMDB9>; rel="next"
    Deprecation:
      description: Deprecation date of this operation, per RFC 9745.
      schema:
        type: string
      example: '@1767225600'
    Sunset:
      description: Date after which the operation stops responding, per RFC 8594.
      schema:
        type: string
      example: Fri, 01 Jan 2027 00:00:00 GMT
  responses:
    NotModified:
      description: Not modified. The conditional request matched; no body is returned.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: Malformed request. Syntactically invalid, or a parameter failed its schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    Unauthorized:
      description: Missing or invalid credentials. No credentials were supplied, or the token has expired
        or been revoked.
      headers:
        WWW-Authenticate:
          description: Challenge describing the accepted schemes.
          schema:
            type: string
          example: Bearer realm="meridian", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    Forbidden:
      description: Authenticated but not permitted. The token is valid but lacks the required scope, or
        the tenant does not own the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    NotFound:
      description: No such resource. The resource does not exist, or the caller's tenant cannot see it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    Conflict:
      description: |
        Conflicting state. Also returned when an `Idempotency-Key` is replayed with a different body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    UnprocessableEntity:
      description: Semantically invalid. The body parsed and matched the schema, but broke a business
        rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    TooManyRequests:
      description: Rate limited. The client exceeded its quota for the current window. Wait for the interval
        in `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    ServerError:
      description: Something broke on our side. Safe to retry with the same `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
    Problem:
      description: Unexpected error. The catch-all shape for any status not described explicitly.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Field-level validation failure
              value:
                type: https://developers.meridian.example.com/problems/validation
                title: Request body failed validation
                status: 422
                detail: 2 fields are invalid.
                instance: /accounts
                errors:
                - pointer: /holder/dateOfBirth
                  code: min_age
                  detail: The account holder must be at least 18 years old.
                - pointer: /currency
                  code: unsupported
                  detail: JPY is not offered on personal accounts.
  schemas:
    CurrencyCode:
      title: Currency code
      type: string
      description: ISO 4217 alphabetic code, restricted to the currencies Meridian settles in.
      enum:
      - GBP
      - EUR
      - USD
      - CHF
      - PLN
      - UAH
      example: GBP
    Money:
      title: Money
      type: object
      description: A decimal amount carried as a string, so no precision is lost in JSON.
      required:
      - amount
      - currency
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]{1,15}\.[0-9]{2}$
          description: Signed decimal in major units, always two fractional digits.
          examples:
          - '1043.28'
          - '-42.00'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    AccountStatus:
      title: Account status
      type: string
      description: |
        Lifecycle state.

        - `pending` — opened but not yet funded.
        - `open` — fully operational.
        - `frozen` — credits accepted, debits refused.
        - `closing` — winding down; balance must reach zero.
        - `closed` — terminal.
      enum:
      - pending
      - open
      - frozen
      - closing
      - closed
    TransactionType:
      title: Transaction type
      type: string
      enum:
      - debit
      - credit
      - fee
      - interest
      - reversal
      - chargeback
    Person:
      title: Person
      type: object
      required:
      - givenName
      - familyName
      - email
      properties:
        givenName:
          type: string
          minLength: 1
          maxLength: 70
        familyName:
          type: string
          minLength: 1
          maxLength: 70
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164, or null when the customer has withheld it.
        role:
          type: string
          enum:
          - director
          - signatory
          - beneficial-owner
    Company:
      title: Company
      type: object
      required:
      - legalName
      - registrationNumber
      - countryOfIncorporation
      properties:
        legalName:
          type: string
          maxLength: 200
        registrationNumber:
          type: string
          pattern: ^[A-Z]{2}-[0-9]{6,12}$
        countryOfIncorporation:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
        website:
          type: string
          format: uri
    Account:
      title: Account
      type: object
      required:
      - id
      - accountType
      - status
      - currency
      - balance
      - openedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        accountType:
          type: string
          enum:
          - personal
          - business
          readOnly: true
        status:
          $ref: '#/components/schemas/AccountStatus'
        nickname:
          type:
          - string
          - 'null'
          maxLength: 60
          description: Customer-chosen label. `null` when never set or cleared.
        iban:
          type: string
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        balance:
          $ref: '#/components/schemas/Money'
        availableBalance:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Balance plus any unused overdraft, minus pending holds.
          readOnly: true
        overdraftLimit:
          $ref: '#/components/schemas/Money'
        openedAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        legacyCode:
          type: string
          deprecated: true
          description: Mainframe account key. Present only for accounts migrated before 2019.
        holder:
          $ref: '#/components/schemas/Person'
        metadata:
          type: object
          description: Partner-defined tags. Keys are namespaced to keep them collision-free.
          maxProperties: 20
          propertyNames:
            pattern: ^[a-z][a-z0-9]*\.[a-z0-9-]{1,40}$
          patternProperties:
            ^tag\.:
              type: string
              maxLength: 100
            ^flag\.:
              type: boolean
          additionalProperties: false
      dependentRequired:
        closedAt:
        - status
    AccountPage:
      title: Account page
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor for the following page, or `null` on the last page.
    AccountCreate:
      title: Account creation request
      description: |
        Discriminated on `accountType`. `defaultMapping` is new in 3.2: it names the
        schema to apply when the discriminating property is missing or carries a
        value with no mapping, instead of leaving the outcome to the tool.
      oneOf:
      - $ref: '#/components/schemas/PersonalAccountCreate'
      - $ref: '#/components/schemas/BusinessAccountCreate'
      - $ref: '#/components/schemas/UnclassifiedAccountCreate'
      discriminator:
        propertyName: accountType
        mapping:
          personal: '#/components/schemas/PersonalAccountCreate'
          business: '#/components/schemas/BusinessAccountCreate'
    AccountCreateBase:
      type: object
      required:
      - accountType
      - currency
      properties:
        accountType:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        nickname:
          type: string
          maxLength: 60
        referralCode:
          type: string
          writeOnly: true
          description: Accepted on creation, never returned.
    PersonalAccountCreate:
      title: Personal account
      type: object
      required:
      - accountType
      - holder
      properties:
        accountType:
          const: personal
        holder:
          $ref: '#/components/schemas/Person'
        overdraftLimit:
          $ref: '#/components/schemas/Money'
      allOf:
      - $ref: '#/components/schemas/AccountCreateBase'
      unevaluatedProperties: false
    BusinessAccountCreate:
      title: Business account
      type: object
      required:
      - accountType
      - company
      - signatories
      properties:
        accountType:
          const: business
        company:
          $ref: '#/components/schemas/Company'
        signatories:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: At least one signatory must be a director.
          items:
            $ref: '#/components/schemas/Person'
          contains:
            type: object
            required:
            - role
            properties:
              role:
                const: director
          minContains: 1
          maxContains: 4
      allOf:
      - $ref: '#/components/schemas/AccountCreateBase'
      unevaluatedProperties: false
    UnclassifiedAccountCreate:
      title: Unclassified account
      description: |
        Fallback for payloads whose `accountType` is absent or unrecognised. The
        request is queued for manual classification rather than rejected outright.
      type: object
      required:
      - accountType
      - contactEmail
      properties:
        accountType:
          type: string
          description: Whatever the client sent, including values with no mapping.
        contactEmail:
          type: string
          format: email
        notes:
          type: string
          maxLength: 2000
      allOf:
      - $ref: '#/components/schemas/AccountCreateBase'
    AccountMergePatch:
      title: Account merge patch
      description: |
        RFC 7396 semantics. Every field is optional; an explicit `null` clears the
        field rather than being ignored.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nickname:
          type:
          - string
          - 'null'
          maxLength: 60
          not:
            const: ''
          description: Send `null` to clear. An empty string is rejected.
        status:
          type: string
          enum:
          - open
          - frozen
          - closing
        overdraftLimit:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        metadata:
          type: object
          additionalProperties:
            type:
            - string
            - boolean
            - 'null'
    JsonPatchDocument:
      title: JSON Patch document
      description: RFC 6902 operation list.
      type: array
      minItems: 1
      items:
        type: object
        required:
        - op
        - path
        properties:
          op:
            type: string
            enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
          path:
            type: string
            format: json-pointer
          from:
            type: string
            format: json-pointer
          value: {}
        if:
          properties:
            op:
              enum:
              - move
              - copy
          required:
          - op
        then:
          required:
          - from
        else:
          not:
            required:
            - from
    Transaction:
      title: Transaction
      allOf:
      - type: object
        required:
        - id
        - type
        - amount
        - bookedAt
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          type:
            $ref: '#/components/schemas/TransactionType'
          amount:
            $ref: '#/components/schemas/Money'
          bookedAt:
            type: string
            format: date-time
          valueDate:
            type: string
            format: date
          reference:
            type: string
            maxLength: 140
          counterparty:
            type: string
          category:
            $ref: '#/components/schemas/CategoryNode'
      - type: object
        properties:
          reversalOf:
            type: string
            format: uuid
            description: Set only on reversals.
        if:
          properties:
            type:
              const: reversal
          required:
          - type
        then:
          required:
          - reversalOf
        else:
          not:
            required:
            - reversalOf
      unevaluatedProperties: false
    TransactionPage:
      title: Transaction page
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type:
          - string
          - 'null'
        totals:
          type: object
          description: Sums over the whole result set, not just this page.
          properties:
            debits:
              $ref: '#/components/schemas/Money'
            credits:
              $ref: '#/components/schemas/Money'
    CategoryNode:
      title: Category
      description: A node in the spend-category tree. Recursive through `children`.
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,30}$
        label:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    TransferRequest:
      title: Transfer request
      description: |
        The rail decides which creditor identifiers are required, expressed with
        `if` / `then` / `else` rather than three near-identical schemas.
      type: object
      required:
      - rail
      - amount
      - creditor
      properties:
        rail:
          type: string
          enum:
          - sepa
          - faster-payments
          - swift
          - internal
        amount:
          $ref: '#/components/schemas/Money'
        creditor:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 140
            iban:
              type: string
              pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
            bic:
              type: string
              pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
            sortCode:
              type: string
              pattern: ^[0-9]{2}-[0-9]{2}-[0-9]{2}$
            accountNumber:
              type: string
              pattern: ^[0-9]{8}$
        reference:
          type: string
          maxLength: 140
        executionDate:
          type: string
          format: date
          description: Defaults to the next business day when omitted.
        chargeBearer:
          type: string
          default: shared
          enum:
          - debtor
          - creditor
          - shared
      if:
        properties:
          rail:
            const: sepa
        required:
        - rail
      then:
        properties:
          creditor:
            required:
            - iban
      else:
        properties:
          creditor:
            anyOf:
            - required:
              - iban
            - required:
              - sortCode
              - accountNumber
    PostingQuery:
      title: Posting query
      description: Filter DSL sent in the body of a `QUERY` request.
      type: object
      required:
      - filter
      properties:
        filter:
          $ref: '#/components/schemas/PostingQuery/$defs/node'
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
        order:
          type: string
          default: desc
          enum:
          - asc
          - desc
      $defs:
        node:
          title: Filter node
          description: Either a leaf comparison or a boolean combination of nodes.
          anyOf:
          - $ref: '#/components/schemas/PostingQuery/$defs/leaf'
          - $ref: '#/components/schemas/PostingQuery/$defs/group'
        leaf:
          type: object
          required:
          - field
          - op
          - value
          additionalProperties: false
          properties:
            field:
              type: string
              enum:
              - amount
              - bookedAt
              - type
              - counterparty
              - reference
            op:
              type: string
              enum:
              - eq
              - neq
              - lt
              - lte
              - gt
              - gte
              - contains
            value:
              anyOf:
              - type: string
              - type: number
              - type: boolean
        group:
          type: object
          required:
          - all
          additionalProperties: false
          properties:
            all:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PostingQuery/$defs/node'
    Event:
      title: Event
      description: One item in the SSE stream, shaped as a CloudEvent.
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - time
      properties:
        specversion:
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uri
        type:
          type: string
          enum:
          - account.opened
          - account.frozen
          - transaction.booked
          - card.blocked
        time:
          type: string
          format: date-time
        subject:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/Account'
          - $ref: '#/components/schemas/Transaction'
          - $ref: '#/components/schemas/Card'
    Payment:
      title: Payment
      type: object
      required:
      - id
      - status
      - amount
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum:
          - received
          - held
          - settled
          - rejected
        amount:
          $ref: '#/components/schemas/Money'
        settlementDelay:
          type: string
          format: duration
          description: ISO 8601 duration before settlement is attempted.
          example: PT2H
        rejectionCode:
          type:
          - string
          - 'null'
    PaymentHold:
      title: Payment hold
      type: object
      required:
      - lockToken
      - expiresAt
      properties:
        lockToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string
    BalanceReport:
      title: Balance report
      type: object
      required:
      - asOf
      - groups
      properties:
        asOf:
          type: string
          format: date
        groups:
          type: array
          items:
            type: object
            required:
            - key
            - total
            properties:
              key:
                type: string
              total:
                $ref: '#/components/schemas/Money'
              accountCount:
                type: integer
                format: int64
                minimum: 0
    DocumentMetadata:
      title: Document metadata
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - passport
          - proof-of-address
          - contract
          - other
        issuedAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        issuingCountry:
          type: string
          pattern: ^[A-Z]{2}$
      dependentRequired:
        expiresAt:
        - issuedAt
    Document:
      title: Document
      type: object
      required:
      - id
      - kind
      - uploadedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
        uploadedAt:
          type: string
          format: date-time
          readOnly: true
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 20971520
        thumbnail:
          type: string
          contentEncoding: base64
          contentMediaType: image/png
          description: Small PNG preview, base64 encoded.
    BatchManifest:
      title: Batch manifest
      type: object
      required:
      - accountId
      - parts
      properties:
        accountId:
          type: string
          format: uuid
        parts:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of file parts that follow the manifest.
    BatchReceipt:
      title: Batch receipt
      type: object
      required:
      - batchId
      - accepted
      properties:
        batchId:
          type: string
          format: uuid
        accepted:
          type: integer
          minimum: 0
        rejected:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              reason:
                type: string
    Card:
      title: Card
      type: object
      xml:
        name: card
      required:
      - id
      - network
      - pan
      - statuses
      properties:
        id:
          type: string
          format: uuid
          xml:
            attribute: true
        network:
          type: string
          enum:
          - visa
          - mastercard
          - amex
          xml:
            attribute: true
        pan:
          type: string
          description: Masked primary account number.
          pattern: ^[0-9]{6}\*{6}[0-9]{4}$
        holder:
          type: string
          xml:
            name: holder
            namespace: urn:meridian:cards
            prefix: cards
        note:
          type: string
          description: Free-text note, emitted as a CDATA section in XML.
        expiry:
          type: string
          pattern: ^[0-9]{2}/[0-9]{2}$
        statuses:
          type: array
          xml:
            name: statuses
            wrapped: true
          items:
            type: string
            enum:
            - active
            - blocked
            - expired
            - stolen
            xml:
              name: status
    XmlMoney:
      title: Money (XML)
      type: object
      description: |
        The same amount as `Money`, shaped for XML: the decimal is the element's text
        node and the currency is an attribute. No `xml.name` is set, so each use takes
        the name of the property it sits under.
      required:
      - value
      - currency
      additionalProperties: false
      properties:
        value:
          type: string
          pattern: ^-?[0-9]{1,15}\.[0-9]{2}$
          description: Signed decimal in major units, always two fractional digits.
        currency:
          type: string
          enum:
          - GBP
          - EUR
          - USD
          - CHF
          - PLN
          - UAH
          xml:
            attribute: true
    XmlMerchant:
      title: Merchant (XML)
      type: object
      description: Nested object with attributes of its own and a prefixed child element.
      xml:
        name: merchant
      required:
      - id
      - mcc
      - name
      - country
      properties:
        id:
          type: string
          pattern: ^[0-9]{8,15}$
          xml:
            attribute: true
        mcc:
          type: string
          pattern: ^[0-9]{4}$
          description: Merchant category code.
          xml:
            attribute: true
        name:
          type: string
          maxLength: 128
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2, emitted in the switch namespace.
          xml:
            namespace: urn:meridian:switch
            prefix: sw
        address:
          type: object
          description: Omitted for card-not-present authorizations.
          xml:
            name: address
          properties:
            line1:
              type: string
            city:
              type: string
            postcode:
              type: string
    CardAuthorization:
      title: Card authorization
      type: object
      description: |
        An authorization as the card switch sends it. Every JSON Schema type appears at
        least once — `string`, `integer`, `number`, `boolean`, `array`, `object` and
        `null` — and every `nodeType` the XML object defines is used: `attribute`,
        `element`, `text`, `cdata` and `none`.
      xml:
        name: authorization
        namespace: urn:meridian:switch
        prefix: sw
      required:
      - messageId
      - sequence
      - cardId
      - amount
      - cardPresent
      - entryMode
      - capturedAt
      properties:
        messageId:
          type: string
          format: uuid
          description: Switch-assigned identifier for this message.
          xml:
            attribute: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic counter within the switch session.
          xml:
            attribute: true
        test:
          type: boolean
          default: false
          description: Set on messages replayed from the certification harness.
          xml:
            attribute: true
        cardId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/XmlMoney'
        exchangeRate:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Applied when the terminal currency differs from the account currency.
        instalments:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 1
        cardPresent:
          type: boolean
        entryMode:
          type: string
          enum:
          - chip
          - contactless
          - magstripe
          - ecommerce
          - manual
        capturedAt:
          type: string
          format: date-time
        expiresOn:
          type: string
          format: date
          description: Expiry printed on the card, as a full date on the last day of the month.
        reversalOf:
          type:
          - string
          - 'null'
          format: uuid
          description: The authorization being reversed. An empty element means null.
        merchant:
          $ref: '#/components/schemas/XmlMerchant'
        terminalNote:
          type: string
          maxLength: 512
          description: Operator free text, emitted as a CDATA section so punctuation needs no escaping.
        emvTags:
          type: array
          maxItems: 64
          description: Wrapped array — the items sit inside an `emvTags` element.
          xml:
            name: emvTags
            wrapped: true
          items:
            type: string
            pattern: ^[0-9A-F]{4}:[0-9A-F]+$
            xml:
              name: tag
        riskFlags:
          type: array
          uniqueItems: true
          description: Unwrapped array — `riskFlag` elements repeat directly under the root.
          items:
            type: string
            enum:
            - velocity
            - geo-mismatch
            - blacklist
            - new-device
            xml:
              name: riskFlag
        cryptogram:
          type: string
          contentEncoding: base64
          contentMediaType: application/octet-stream
          description: Application cryptogram as issued by the chip.
    CardAuthorizationResult:
      title: Authorization result
      type: object
      xml:
        name: authorizationResult
        namespace: urn:meridian:switch
        prefix: sw
      required:
      - messageId
      - decision
      - receivedAt
      properties:
        messageId:
          type: string
          format: uuid
          description: Echoed from the request.
          xml:
            attribute: true
        decision:
          type: string
          enum:
          - approved
          - declined
          - referred
          xml:
            attribute: true
        authCode:
          type: string
          pattern: ^[0-9A-Z]{6}$
          description: Present only when `decision` is `approved`.
        declineReason:
          type: string
          description: Scheme wording, passed through unaltered.
        availableBalance:
          $ref: '#/components/schemas/XmlMoney'
        receivedAt:
          type: string
          format: date-time
    Atm:
      title: ATM
      type: object
      required:
      - id
      - coordinates
      properties:
        id:
          type: string
        coordinates:
          type: array
          description: Longitude then latitude, as a fixed-length tuple.
          minItems: 2
          maxItems: 2
          prefixItems:
          - type: number
            format: double
            minimum: -180
            maximum: 180
          - type: number
            format: double
            minimum: -90
            maximum: 90
          items: false
        services:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - withdrawal
            - deposit
            - cheque-deposit
        host:
          type: string
          format: hostname
        managementIp:
          type: string
          format: ipv4
          writeOnly: true
    FxQuote:
      title: FX quote
      type: object
      required:
      - pair
      - rate
      - expiresAt
      properties:
        pair:
          type: string
          pattern: ^[A-Z]{3}/[A-Z]{3}$
        rate:
          type: number
          format: double
          exclusiveMinimum: 0
        expiresAt:
          type: string
          format: date-time
        quoteId:
          type: string
          format: uuid
    TariffTable:
      title: Tariff table
      type: object
      description: |
        A collection at the root of the document. `effectiveFrom` and `revision` are
        attributes on the root element, and the array itself is unwrapped, so the
        `tariff` elements are direct children of `ref:tariffs`.
      xml:
        name: tariffs
        namespace: urn:meridian:reference
        prefix: ref
      required:
      - effectiveFrom
      - tariffs
      properties:
        effectiveFrom:
          type: string
          format: date
          xml:
            attribute: true
        revision:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Assigned by the server on write.
          xml:
            attribute: true
        tariffs:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Tariff'
    Tariff:
      title: Tariff
      description: One of three shapes, chosen by the `kind` attribute.
      xml:
        name: tariff
      oneOf:
      - $ref: '#/components/schemas/FlatFeeTariff'
      - $ref: '#/components/schemas/PercentageTariff'
      - $ref: '#/components/schemas/TieredTariff'
      discriminator:
        propertyName: kind
        mapping:
          flat: '#/components/schemas/FlatFeeTariff'
          percentage: '#/components/schemas/PercentageTariff'
          tiered: '#/components/schemas/TieredTariff'
    TariffBase:
      title: Tariff (common fields)
      type: object
      required:
      - code
      - kind
      - label
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{3,32}$
          xml:
            attribute: true
        kind:
          type: string
          xml:
            attribute: true
        label:
          type: string
          maxLength: 120
        appliesTo:
          type: array
          minItems: 1
          uniqueItems: true
          xml:
            name: appliesTo
            wrapped: true
          items:
            type: string
            enum:
            - personal
            - business
            xml:
              name: segment
    FlatFeeTariff:
      title: Flat fee tariff
      allOf:
      - $ref: '#/components/schemas/TariffBase'
      - type: object
        required:
        - fee
        properties:
          kind:
            type: string
            const: flat
            xml:
              attribute: true
          fee:
            $ref: '#/components/schemas/XmlMoney'
    PercentageTariff:
      title: Percentage tariff
      allOf:
      - $ref: '#/components/schemas/TariffBase'
      - type: object
        required:
        - rate
        properties:
          kind:
            type: string
            const: percentage
            xml:
              attribute: true
          rate:
            type: number
            format: double
            minimum: 0
            maximum: 1
            description: Fraction of the transaction amount, not a percentage.
          minimumFee:
            $ref: '#/components/schemas/XmlMoney'
          maximumFee:
            $ref: '#/components/schemas/XmlMoney'
    TieredTariff:
      title: Tiered tariff
      allOf:
      - $ref: '#/components/schemas/TariffBase'
      - type: object
        required:
        - tiers
        properties:
          kind:
            type: string
            const: tiered
            xml:
              attribute: true
          tiers:
            type: array
            minItems: 1
            maxItems: 12
            xml:
              name: tiers
              wrapped: true
            items:
              type: object
              required:
              - upTo
              - fee
              xml:
                name: tier
              properties:
                upTo:
                  type:
                  - number
                  - 'null'
                  format: double
                  exclusiveMinimum: 0
                  description: |
                    Upper bound of the tier. Null on the top tier, which is unbounded; XML
                    has no null attribute, so the attribute is omitted there instead.
                  xml:
                    attribute: true
                fee:
                  $ref: '#/components/schemas/XmlMoney'
    Problem:
      title: Problem details
      description: RFC 9457 problem details, extended with a machine-readable `errors` array.
      externalDocs:
        description: Error catalogue
        url: https://developers.meridian.example.com/errors
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          description: Correlation id for support requests.
        errors:
          type: array
          description: Present on validation failures.
          items:
            type: object
            required:
            - pointer
            - code
            properties:
              pointer:
                type: string
                format: json-pointer
              code:
                type: string
              detail:
                type: string
    DiagnosticEnvelope:
      title: Diagnostic envelope
      type: object
      description: The payload the diagnostics endpoints accept, whatever the media type.
      required:
      - capturedAt
      - severity
      properties:
        capturedAt:
          type: string
          format: date-time
        severity:
          type: string
          enum:
          - debug
          - info
          - warning
          - error
        source:
          type: string
          enum:
          - switch
          - terminal
          - portal
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DiagnosticEvent'
        context:
          type: object
          description: Free-form key-value pairs. Values are strings only.
          additionalProperties:
            type: string
    DiagnosticEvent:
      title: Diagnostic event
      type: object
      description: One line of an `application/x-ndjson` stream.
      required:
      - at
      - severity
      - message
      properties:
        at:
          type: string
          format: date-time
        severity:
          type: string
          enum:
          - debug
          - info
          - warning
          - error
        message:
          type: string
          maxLength: 500
    DiagnosticEcho:
      title: Diagnostic echo
      type: object
      description: What the server parsed out of the request.
      required:
      - received
      properties:
        received:
          type: object
          description: |
            One entry per parameter or body part, keyed by name. `raw` is the value as
            it arrived, `parsed` is the value after the declared style was applied.
          additionalProperties:
            type: object
            properties:
              raw:
                type: string
              parsed: {}
        unrecognised:
          type: array
          description: Names the server received but the description does not declare.
          items:
            type: string
