  /cards/{cardId}/authorizations:
    parameters:
    - name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: authorizeCard
      tags:
      - cards
      summary: Authorize a card transaction
      description: |
        XML is the canonical request body here — the switch speaks XML — and JSON is
        offered alongside it only so the same payload can be read both ways.

        `CardAuthorization` carries one of every JSON Schema type (`string`, `integer`,
        `number`, `boolean`, `array`, `object`, `null`) and uses every `nodeType` the
        XML object defines: `attribute`, `element`, `text`, `cdata` and `none`.
      security:
      - mutualTls: []
        oauth2ClientCredentials:
        - cards:write
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        description: The authorization message.
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
            examples:
              contactless:
                summary: Contactless purchase, card present
                description: |
                  `dataValue` is the schema-valid data. `serializedValue` is what goes on
                  the wire once the `xml` keywords in the schema are applied.
                value:
                  messageId: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                  sequence: 4471
                  test: false
                  cardId: 8c1a7d4e-2b8c-4a2f-9a41-0d5a6f5b2f0e
                  amount:
                    value: '42.50'
                    currency: GBP
                  exchangeRate: 1.0
                  instalments: 1
                  cardPresent: true
                  entryMode: contactless
                  capturedAt: '2026-09-08T11:04:19Z'
                  expiresOn: '2029-04-30'
                  reversalOf: null
                  merchant:
                    id: '412200871'
                    mcc: '5812'
                    name: Bletchley Coffee House
                    country: GB
                    address:
                      line1: 12 Wilton Avenue
                      city: Milton Keynes
                      postcode: MK3 6EB
                  terminalNote: Tap & go; printed receipt declined
                  emvTags:
                  - 9F02:000000004250
                  - 9F36:00A4
                  riskFlags:
                  - velocity
                  cryptogram: 3q2+7wAAAAA=
              reversal:
                summary: Reversal of an earlier authorization, card not present
                description: |
                  A negative amount, `reversalOf` populated, no merchant address, and two
                  repeated `riskFlag` elements from the unwrapped array.
                value:
                  messageId: 5b71e0d4-a913-4c88-b0f2-1e9a3c7d0442
                  sequence: 4472
                  cardId: 8c1a7d4e-2b8c-4a2f-9a41-0d5a6f5b2f0e
                  amount:
                    value: '-42.50'
                    currency: GBP
                  cardPresent: false
                  entryMode: ecommerce
                  capturedAt: '2026-09-08T11:09:02Z'
                  reversalOf: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                  merchant:
                    id: '412200871'
                    mcc: '5812'
                    name: Bletchley Coffee House
                    country: GB
                  terminalNote: Customer cancelled at the terminal
                  riskFlags:
                  - geo-mismatch
                  - new-device
          application/json:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
            examples:
              contactless:
                summary: The same message as JSON
                description: |
                  The `xml` keywords in the schema have no effect here, so attributes,
                  text nodes and CDATA all collapse back to ordinary properties.
                value:
                  messageId: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                  sequence: 4471
                  test: false
                  cardId: 8c1a7d4e-2b8c-4a2f-9a41-0d5a6f5b2f0e
                  amount:
                    value: '42.50'
                    currency: GBP
                  cardPresent: true
                  entryMode: contactless
                  capturedAt: '2026-09-08T11:04:19Z'
                  merchant:
                    id: '412200871'
                    mcc: '5812'
                    name: Bletchley Coffee House
                    country: GB
                  riskFlags:
                  - velocity
      responses:
        '201':
          description: |
            Authorization decided. Returned in the media type the request asked for with `Accept`, defaulting to
            the media type the request was sent in.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
              examples:
                approved:
                  summary: Approved
                  value:
                    messageId: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                    decision: approved
                    authCode: 7K2P41
                    availableBalance:
                      value: '958.14'
                      currency: GBP
                    receivedAt: '2026-09-08T11:04:19Z'
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
        '402':
          description: |
            The switch reached a decision and it was `declined`. The body is a result, not
            a problem document, because nothing went wrong with the request itself.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
              examples:
                insufficientFunds:
                  summary: Insufficient funds
                  value:
                    messageId: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                    decision: declined
                    declineReason: Insufficient funds; available 12.06 GBP
                    availableBalance:
                      value: '12.06'
                      currency: GBP
                    receivedAt: '2026-09-08T11:04:19Z'
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          description: Unsupported media type. The body was neither `application/xml` nor `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /switch/messages:
    post:
      operationId: postSwitchMessage
      deprecated: true
      tags:
      - cards
      - sunset
      summary: Post a raw switch message
      description: |
        One operation, seven request media types: the same authorization can arrive as XML
        under two media types and a vendor one, as JSON, as form encoding, as a
        pipe-delimited line, or as a raw ISO 8583 frame. Which one a terminal sends
        depends on how old it is.

        Use `POST /cards/{cardId}/authorizations` instead. This endpoint is removed on
        the sunset date below.
      security:
      - basicAuth: []
      - mutualTls: []
        httpSignature: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The same logical message in whichever encoding the terminal speaks.
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
          text/xml:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
            examples:
              minimal:
                summary: The smallest message the switch accepts
                value:
                  messageId: 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
                  sequence: 4471
                  cardId: 8c1a7d4e-2b8c-4a2f-9a41-0d5a6f5b2f0e
                  amount:
                    value: '42.50'
                    currency: GBP
                  cardPresent: true
                  entryMode: contactless
                  capturedAt: '2026-09-08T11:04:19Z'
                  merchant:
                    id: '412200871'
                    mcc: '5812'
                    name: Bletchley Coffee House
                    country: GB
          application/vnd.meridian.switch+xml;version=2:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
          application/json:
            schema:
              $ref: '#/components/schemas/CardAuthorization'
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: |
                Form encoding has no nesting, so the message is flattened: the arrays are
                repeated keys and the merchant is serialized with `deepObject`.
              required:
              - messageId
              - cardId
              - amount
              - currency
              properties:
                messageId:
                  type: string
                  format: uuid
                cardId:
                  type: string
                  format: uuid
                amount:
                  type: string
                  pattern: ^-?[0-9]{1,15}\.[0-9]{2}$
                currency:
                  $ref: '#/components/schemas/CurrencyCode'
                cardPresent:
                  type: boolean
                  default: true
                entryMode:
                  type: string
                  enum:
                  - chip
                  - contactless
                  - magstripe
                  - ecommerce
                  - manual
                riskFlags:
                  type: array
                  items:
                    type: string
                merchant:
                  type: object
                  properties:
                    id:
                      type: string
                    mcc:
                      type: string
                    name:
                      type: string
            encoding:
              riskFlags:
                style: form
                explode: true
              merchant:
                style: deepObject
                explode: true
                allowReserved: false
          text/plain:
            schema:
              type: string
              maxLength: 1024
              pattern: ^0100\|
              description: |
                Pipe-delimited record, in field order: MTI, message id, card id, minor
                units, currency, entry mode, capture timestamp, merchant id.
            example: |
              0100|3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913|8c1a7d4e-2b8c-4a2f-9a41-0d5a6f5b2f0e|4250|826|07|20260908110419|412200871
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              description: Raw ISO 8583 frame, two-byte big-endian length prefix included.
      responses:
        '202':
          description: |
            Message queued. The switch acknowledges the frame; the decision follows on the terminal's own
            response channel.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationResult'
            text/plain:
              schema:
                type: string
                description: Single line, `ACK` followed by the message id.
              example: ACK 3f2a9c14-6d0b-4f5e-9c2a-77b1e0d4a913
        '415':
          description: Unsupported media type. The `Content-Type` is not one of the seven the switch accepts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /branches/{branchId}/atms/{coords}:
