      description: |
        Also served as XML for the legacy switch integration. The XML shape is
        described with `nodeType`, which replaces the deprecated `attribute` and
        `wrapped` booleans.
      security:
      - oauth2AuthCode:
        - cards:read
      - basicAuth: []
      responses:
        '200':
          description: The card. The primary account number is always masked. Full PANs are never returned.
          content:
            application/json:
