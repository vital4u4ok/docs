openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Meridian Bank API
  summary: Accounts, transactions, payments and cards for the Meridian core banking platform.
  description: |
    A deliberately feature-dense OpenAPI 3.2.0 description, written to exercise as much
    of the specification as a single document reasonably can.

    This is the OpenAPI 3.1 rendering of the description, generated from `openapi.yaml` by
    `scripts/generate-openapi-3.1.py`. The 3.2 original is the source of truth.
  termsOfService: https://meridian.example.com/terms
  version: 2026.09.1
  contact:
    name: Meridian Developer Platform
    url: https://developers.meridian.example.com
    email: api@meridian.example.com
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
externalDocs:
  description: Developer portal
  url: https://developers.meridian.example.com/guides
servers:
- url: https://{tenant}.api.meridian.example.com/v2
  description: Production. Requires mutual TLS on every payment-initiating call.
  variables:
    tenant:
      description: Regional deployment the client is onboarded to.
      default: eu
      enum:
      - eu
      - uk
      - us
- url: https://sandbox.api.meridian.example.com/v2
  description: Sandbox with seeded data. Money never moves.
- url: http://localhost:{port}/v2
  description: Local mock server.
  variables:
    port:
      default: '8080'
tags:
- name: banking
  description: Core banking resources.
- name: accounts
  description: Open, inspect, amend and close accounts.
  externalDocs:
    description: Account lifecycle guide
    url: https://developers.meridian.example.com/guides/accounts
- name: transactions
  description: Postings on an account.
- name: payments
  description: Payment instructions and their holds.
- name: cards
  description: Debit and credit card instruments.
- name: documents
  description: Statements, contracts and KYC uploads.
- name: streaming
  description: Long-lived responses delivered as a sequence of items.
- name: reference
  description: Public, unauthenticated lookup data.
- name: system
  description: Liveness and metadata endpoints.
- name: beta
  description: Subject to breaking change without a major version bump.
- name: diagnostics
  description: |
    Endpoints that exist to exercise this description rather than to move money.
    Every parameter style, media type and security scheme that the rest of the API
    does not already use is reachable from here.
- name: sunset
  description: Scheduled for removal. Migrate before the sunset date.
security:
- oauth2AuthCode:
  - accounts:read
paths:
  /accounts:
    summary: Account collection
    description: Everything that operates on the set of accounts a client can see.
    get:
      operationId: listAccounts
      tags:
      - accounts
      summary: List accounts
      description: |
        Cursor-paginated. The `Link` header carries `next` and `prev` relations;
        prefer it over constructing cursors by hand.
      security:
      - oauth2AuthCode:
        - accounts:read
      - oauth2Implicit:
        - accounts:read
      - bearerJwt: []
      - apiKeyHeader: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        description: Return only accounts in these states. Repeat-free, comma-joined.
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/AccountStatus'
        examples:
          singleState:
            summary: One state
            value:
            - open
          twoStates:
            summary: 'Two states, comma-joined by `explode: false`'
            value:
            - open
            - frozen
      - name: currency
        in: query
        description: Filter by settlement currency.
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/CurrencyCode'
      - name: productCodes
        in: query
        description: Space-delimited list of internal product codes.
        style: spaceDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}-[0-9]{3}$
        example:
        - CU-100
        - SV-220
      - name: branchCodes
        in: query
        description: Pipe-delimited list of branch codes.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filter
        in: query
        description: Structured filter serialized as `filter[field]=value`.
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: false
          properties:
            openedAfter:
              type: string
              format: date
            balanceAtLeast:
              type: number
              format: double
              minimum: 0
            holderName:
              type: string
        examples:
          byHolder:
            summary: Non-ASCII holder name
            description: Shows why the serialized form matters for `deepObject`.
            value:
              holderName: Ольга Ковальчук
      - name: q
        in: query
        description: Free-text search. Reserved characters are passed through unencoded.
        allowReserved: true
        schema:
          type: string
          maxLength: 128
      - name: sort
        in: query
        description: Sort key. Prefix with `-` to reverse.
        schema:
          type: string
          default: -openedAt
          enum:
          - openedAt
          - -openedAt
          - balance
          - -balance
      - name: page
        in: query
        deprecated: true
        description: Offset paging. Superseded by `cursor` and ignored when `cursor` is present.
        schema:
          type: integer
          minimum: 1
      - name: mb_experiment
        in: cookie
        description: Opt into an experimental response shape.
        schema:
          type: string
          enum:
          - balances-v2
      responses:
        '200':
          description: |
            A page of accounts. The page is never empty unless the whole result set is empty; an empty
            page with a `next` link is not returned.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Link:
              $ref: '#/components/headers/Link'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            Set-Cookie:
              description: Sticky routing cookie. Modeled with `content`, one value per line.
              content:
                text/plain:
                  schema:
                    type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
              examples:
                firstPage:
                  summary: First page
                  value:
                    items:
                    - id: 6f5b2f0e-0d5a-4a2f-9a41-2b8c1a7d4e10
                      accountType: personal
                      status: open
                      iban: GB29MERI60161331926819
                      currency: GBP
                      balance:
                        amount: '1043.28'
                        currency: GBP
                      openedAt: '2024-03-11T09:14:02Z'
                    nextCursor: eyJvIjoxMDB9
                empty:
                  summary: No matches
                  value:
                    items: []
                    nextCursor: null
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: openAccount
      tags:
      - accounts
      summary: Open an account
      description: |
        Requires both a client certificate and a client-credentials token: the two
        schemes in the single requirement below are ANDed.
      security:
      - mutualTls: []
        oauth2ClientCredentials:
        - accounts:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        description: Discriminated by `accountType`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              personal:
                summary: Personal current account
                value:
                  accountType: personal
                  currency: GBP
                  holder:
                    givenName: Ada
                    familyName: Lovelace
                    dateOfBirth: '1990-12-10'
                    email: ada@example.com
                  overdraftLimit:
                    amount: '250.00'
                    currency: GBP
              business:
                summary: Business account
                value:
                  accountType: business
                  currency: EUR
                  company:
                    legalName: Kvitka Holdings B.V.
                    registrationNumber: NL-88213344
                    countryOfIncorporation: NL
                  signatories:
                  - givenName: Mykola
                    familyName: Petrenko
                    email: mykola@example.com
      responses:
        '201':
          description: Account opened. The account is immediately usable for credits, and for debits once
            funded.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '202':
          description: Queued for manual review. Returned when the applicant is flagged by screening.
            Poll the `Location` target.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{accountId}:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getAccount
      tags:
      - accounts
      summary: Fetch an account
      security:
      - oauth2AuthCode:
        - accounts:read
      - openId: []
      - apiKeyCookie: []
      parameters:
      - name: If-None-Match
        in: header
        description: Conditional fetch. Send the `ETag` from a previous response.
        schema:
          type: string
        example: '"a3f1c9"'
      - name: include
        in: query
        description: Expand related resources inline.
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - holder
            - cards
            - limits
      responses:
        '200':
          description: The account. Always reflects committed state; pending postings are excluded from
            `balance`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Private caching directive.
              schema:
                type: string
                default: private, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: amendAccount
      tags:
      - accounts
      summary: Amend an account
      description: |
        Two patch dialects are accepted. `application/merge-patch+json` treats an
        explicit `null` as "clear this field"; `application/json-patch+json` uses
        pointer operations.
      security:
      - oauth2AuthCode:
        - accounts:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: true
        description: Optimistic concurrency. Rejected with `412` when stale.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AccountMergePatch'
            examples:
              clearNickname:
                summary: Clear a nullable field
                value:
                  nickname: null
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocument'
            examples:
              replaceStatus:
                summary: Freeze the account
                value:
                - op: replace
                  path: /status
                  value: frozen
      responses:
        '200':
          description: Amended account. Reflects the patch. A fresh `ETag` is returned for the next conditional
            update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: Precondition failed. The `If-Match` value no longer matches the stored `ETag`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: closeAccount
      tags:
      - accounts
      - sunset
      summary: Close an account
      deprecated: true
      description: |
        Deprecated. Closing is now a state transition; send a merge patch with
        `status: closing` instead. Removed on 2027-01-01.
      security:
      - mutualTls: []
        oauth2AuthCode:
        - accounts:write
      responses:
        '204':
          description: Closed. No body. The account id remains resolvable for seven years.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          description: Locked. A legal hold prevents closure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{accountId}/transactions:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listTransactions
      tags:
      - transactions
      summary: List transactions
      security:
      - oauth2AuthCode:
        - transactions:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: bookedFrom
        in: query
        required: true
        description: Inclusive lower bound on booking time.
        schema:
          type: string
          format: date-time
        example: '2026-01-01T00:00:00Z'
      - name: bookedTo
        in: query
        description: Exclusive upper bound. Defaults to now.
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        description: Restrict to these posting types.
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TransactionType'
      - name: minAmount
        in: query
        description: Minimum absolute amount, in major units.
        schema:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
      responses:
        '200':
          description: A page of transactions. Newest first. Pending authorisations are not included until
            they book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTransfer
      tags:
      - transactions
      - payments
      summary: Initiate a transfer
      description: |
        Debits this account. Requires a detached HTTP message signature in addition
        to a bearer token, so both schemes appear in one requirement.
      security:
      - httpSignature: []
        oauth2AuthCode:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              sepa:
                summary: SEPA credit transfer
                value:
                  rail: sepa
                  amount:
                    amount: '120.00'
                    currency: EUR
                  creditor:
                    name: Ольга Ковальчук
                    iban: NL91MERI0417164300
                  reference: Invoice 2026-114
                  executionDate: '2026-09-02'
              faster:
                summary: UK Faster Payment
                value:
                  rail: faster-payments
                  amount:
                    amount: '75.50'
                    currency: GBP
                  creditor:
                    name: Grace Hopper
                    sortCode: 60-16-13
                    accountNumber: '31926819'
      responses:
        '201':
          description: Transfer accepted. The instruction was accepted for processing. Settlement happens
            asynchronously.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '402':
          description: Insufficient funds. The available balance, including any overdraft, cannot cover
            the debit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{accountId}/transactions/export:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      operationId: exportTransactions
      tags:
      - transactions
      - streaming
      summary: Export transactions as a stream
      description: |
        The JSON Lines variant is a sequential media type. Its Media Type Object
        carries `itemSchema` rather than `schema`, because the payload as a whole
        is not one JSON document.
      security:
      - oauth2AuthCode:
        - transactions:read
      parameters:
      - name: bookedFrom
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The export stream. Delivered with `Transfer-Encoding, chunked`; expect a long-lived
            response.
          headers:
            Content-Disposition:
              description: Suggested filename for browser downloads.
              schema:
                type: string
              example: attachment; filename="transactions-2026-01.jsonl"
          content:
            application/jsonl:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
            text/csv:
              schema:
                type: string
                contentMediaType: text/csv
              example: |
                id,bookedAt,type,amount,currency
                6f5b2f0e,2026-01-04T10:00:00Z,debit,-42.00,GBP
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /events:
    get:
      operationId: streamEvents
      tags:
      - streaming
      - beta
      summary: Subscribe to the account event stream
      description: Server-sent events. Reconnect with `Last-Event-ID` to resume.
      security:
      - bearerJwt: []
      - apiKeyCookie: []
      parameters:
      - name: Last-Event-ID
        in: header
        description: Resume token from a previous stream.
        schema:
          type: string
      - name: topics
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - account.opened
            - account.frozen
            - transaction.booked
            - card.blocked
      responses:
        '200':
          description: An open event stream. Stays open until the client disconnects. A comment line is
            sent every 15 seconds as a keep-alive.
          content:
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
  /payments/{paymentId}:
    parameters:
    - name: paymentId
      in: path
      required: true
      description: Payment instruction identifier.
      schema:
        type: string
        format: uuid
    get:
      operationId: getPayment
      tags:
      - payments
      summary: Fetch a payment
      security:
      - oauth2AuthCode:
        - payments:read
      responses:
        '200':
          description: Includes the current status and, when the payment is held, the reason for the hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /reports/balances:
    get:
      operationId: getBalanceReport
      tags:
      - documents
      - beta
      summary: Balance report with a structured query string
      description: |
        The 3.2 version of this API describes the whole query string as a single `in: querystring` parameter with an explicit media type. 3.1 has no such location, so the fields are listed as ordinary query parameters.
      security:
      - oauth2AuthCode:
        - accounts:read
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: asOf
        in: query
        schema:
          type: string
          format: date
        required: true
      - name: accounts
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: true
        style: form
        explode: true
      - name: groupBy
        in: query
        schema:
          type: string
          enum:
          - currency
          - product
          - branch
      responses:
        '200':
          description: The report. Returned as JSON, or as a rendered PDF when the client asks for that
            media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceReport'
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Problem'
  /documents:
    post:
      operationId: uploadDocument
      tags:
      - documents
      summary: Upload a KYC document
      description: Multipart upload with per-part encoding declared through `encoding`.
      security:
      - oauth2AuthCode:
        - documents:write
      - apiKeyHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - metadata
              - file
              properties:
                metadata:
                  $ref: '#/components/schemas/DocumentMetadata'
                file:
                  type: string
                  contentMediaType: application/pdf
                  description: The document itself.
                labels:
                  type: array
                  items:
                    type: string
            encoding:
              metadata:
                contentType: application/json
                headers:
                  X-Part-Checksum:
                    description: SHA-256 of the part body, hex encoded.
                    schema:
                      type: string
                      pattern: ^[0-9a-f]{64}$
              file:
                contentType: application/pdf
                headers:
                  Content-Disposition:
                    schema:
                      type: string
              labels:
                contentType: text/plain
                style: form
                explode: true
                allowReserved: false
      responses:
        '201':
          description: Document stored. The document is queued for automated verification; the outcome
            arrives as an event.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '413':
          description: Payload too large. The hard limit is 20 MiB per part.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        '415':
          description: Unsupported media type. The part's `Content-Type` is not accepted for this document
            kind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  summary: Field-level validation failure
                  value:
                    type: https://developers.meridian.example.com/problems/validation
                    title: Request body failed validation
                    status: 422
                    detail: 2 fields are invalid.
                    instance: /accounts
                    errors:
                    - pointer: /holder/dateOfBirth
                      code: min_age
                      detail: The account holder must be at least 18 years old.
                    - pointer: /currency
                      code: unsupported
                      detail: JPY is not offered on personal accounts.
        default:
          $ref: '#/components/responses/Problem'
  /documents/batch:
    post:
      operationId: uploadDocumentBatch
      tags:
      - documents
      - beta
      summary: Upload an ordered batch of documents
      description: |
        The 3.2 version of this API describes an ordered `multipart/mixed` body with `prefixEncoding` and `itemEncoding`. 3.1 can only key encoding by property name, so the parts are named instead.
      security:
      - oauth2AuthCode:
        - documents:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - manifest
              - files
              properties:
                manifest:
                  $ref: '#/components/schemas/BatchManifest'
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    contentMediaType: application/pdf
            encoding:
              manifest:
                contentType: application/json
              files:
                contentType: application/pdf
      responses:
        '202':
          description: Batch accepted. Parts are processed asynchronously. Poll the batch or wait for
            the events.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReceipt'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{cardId}:
